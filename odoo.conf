[options]
; Configuration Odoo minimale pour l'environnement de développement.

; Connexion PostgreSQL (cf. service "db" du docker-compose).
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Chemins des addons : modules natifs Odoo + modules AITE Courrier.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Stockage des pièces jointes / filestore.
data_dir = /var/lib/odoo

; Mot de passe maître pour la gestion des bases (à changer hors dev).
admin_passwd = admin

; Confort de développement : rechargement à chaud du code Python.
dev_mode = reload

; Journalisation.
log_level = info
