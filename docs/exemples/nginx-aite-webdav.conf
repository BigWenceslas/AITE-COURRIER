# AITE ECM / AITE Courrier — HTTPS devant Odoo 18, par nginx.
#
# À adapter : server_name, chemins des certificats. Sous Windows, les chemins
# s'écrivent avec des barres obliques (C:/certs/ecm.crt).

upstream odoo      { server 127.0.0.1:8069; }
upstream odoo_chat { server 127.0.0.1:8072; }

server {
    listen 80;
    server_name ecm.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ecm.exemple.fr;

    ssl_certificate     C:/certs/ecm.crt;
    ssl_certificate_key C:/certs/ecm.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Taille maximale d'un dépôt : 100 Mo côté ECM, 50 Mo côté courrier.
    client_max_body_size 100m;

    # Les transferts WebDAV et les longues opérations Odoo ont besoin d'air.
    proxy_read_timeout  720s;
    proxy_send_timeout  720s;
    proxy_connect_timeout 720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Espace documentaire : ne rien tamponner, ne rien mettre en cache, et
    # laisser passer les verbes WebDAV (nginx les transmet tels quels ; ne pas
    # ajouter de filtrage par méthode).
    location /webdav/ {
        proxy_pass http://odoo;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
    }

    location /websocket {
        proxy_pass http://odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }
}
